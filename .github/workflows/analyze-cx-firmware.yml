name: Analyze LG CX 04.64.00 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-cx-firmware.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Official LG 04.64.00 package for the same 2020 O20 / jhericurl generation.
      # This download is from LG's support CDN. It is not the JP PJA package, so
      # all findings must be treated as same-generation evidence until confirmed
      # on OLED65CXPJA.
      FW_URL: https://gscs-b2c.lge.com/downloadFile?fileId=Y4IONzJGIHWYuTO4uhPVZA

    steps:
      - uses: actions/checkout@v4

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake liblzo2-dev libssl-dev libc6-dev zlib1g-dev             fakeroot squashfs-tools unzip binutils binutils-arm-linux-gnueabihf file

      - name: Download official LG firmware
        run: |
          mkdir -p work/report
          curl --fail --location --retry 3 --retry-delay 5             --output work/firmware.zip "$FW_URL"
          {
            echo "# Firmware download"
            date -u
            ls -lh work/firmware.zip
            sha256sum work/firmware.zip
          } | tee work/report/download.txt

      - name: Inspect and unpack firmware ZIP
        run: |
          {
            echo "# ZIP listing"
            unzip -l work/firmware.zip
          } | tee work/report/zip-listing.txt
          mkdir -p work/zip
          unzip -q work/firmware.zip -d work/zip
          find work/zip -maxdepth 3 -type f -printf '%p\t%s bytes\n'             | tee work/report/unpacked-files.txt
          EPK="$(find work/zip -type f -iname '*.epk' -print -quit)"
          if [ -z "$EPK" ]; then
            echo "No .epk found" | tee work/report/error.txt
            exit 1
          fi
          echo "$EPK" | tee work/epk-path.txt

      - name: Build epk2extract
        run: |
          git clone --depth 1 https://github.com/openlgtv/epk2extract.git work/epk2extract
          cd work/epk2extract
          CMAKE_FLAGS=-DCMAKE_BUILD_TYPE=Test ./build.sh
          find . -type f -name epk2extract -perm -111 -print             | tee ../report/epk2extract-binaries.txt

      - name: Extract EPK and rootfs
        id: extract
        run: |
          set -o pipefail
          EPK="$(cat work/epk-path.txt)"
          # build.sh installs AES.key and the platform PEM files next to this
          # top-level binary. Do not accidentally select build_linux/obj/src/
          # epk2extract, which has no adjacent key files.
          BIN="$(realpath work/epk2extract/build_linux/epk2extract)"
          test -x "$BIN"
          test -f "$(dirname "$BIN")/AES.key"
          test -f "$(dirname "$BIN")/o20.pem"
          mkdir -p work/extract
          cp "$EPK" work/extract/firmware.epk

          (
            cd work/extract
            echo "# EPK extraction"
            fakeroot "$BIN" firmware.epk
          ) 2>&1 | tee work/report/epk-extract.log

          if grep -Eq 'Cannot decrypt EPK|proper AES key is missing|Cannot open key file' work/report/epk-extract.log; then
            echo "EPK decryption failed" >&2
            exit 1
          fi

          ROOTFS="$(find work/extract -type f -name 'rootfs.pak' -print -quit)"
          if [ -n "$ROOTFS" ] && ! find work/extract -type d -name 'rootfs.pak.unsquashfs' -print -quit | grep -q .; then
            ROOTDIR="$(dirname "$ROOTFS")"
            ROOTBASE="$(basename "$ROOTFS")"
            (
              cd "$ROOTDIR"
              echo "# Explicit rootfs extraction"
              fakeroot "$BIN" "$ROOTBASE"
            ) 2>&1 | tee -a "$(realpath work/report/epk-extract.log)"
          fi

          {
            echo "# Extracted top-level files"
            find work/extract -maxdepth 4 -type f -printf '%p\t%s bytes\n' | head -500
          } > work/report/extracted-files.txt

      - name: Analyze ACR capture components
        if: always()
        run: |
          REPORT=work/report/acr-analysis.txt
          {
            echo "# ACR / capture component analysis"
            echo
            echo "## Candidate files"
            find work/extract -type f \(               -name 'acr2' -o               -name 'adoverlay-service' -o               -name 'libvtcapture.so*' -o               -name 'libalphonsosolution.so*' -o               -name 'libalphonsoadoverlay.so*' -o               -name 'libsambasolution.so*' -o               -name 'libnielsensolution.so*'             \) -print 2>/dev/null | sort

            ACR="$(find work/extract -type f -name acr2 -print -quit 2>/dev/null || true)"
            if [ -z "$ACR" ]; then
              echo
              echo "acr2 executable not found in extracted output."
              exit 0
            fi

            echo
            echo "## acr2 file metadata"
            file "$ACR" || true
            sha256sum "$ACR" || true

            echo
            echo "## acr2 dynamic dependencies"
            readelf -d "$ACR" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true

            echo
            echo "## acr2 capture-related strings"
            strings -a "$ACR" | grep -Ei               'libvtcapture|vtcapture|DaiFastCapture|VideoCapture|ImageConverter|CaptureBuff|CaptureDelegate|capture_method|capture_format|video.?capture|getVideoCaptureStatus|getCaptureCondition|getCaptureSpeed|setCaptureSpeed|com\.webos\.service\.capture|capture\.client|CAPTURE_LOCATION|AcquireVt|CreateContext|video60'               | sort -u | head -1000 || true

            echo
            echo "## acr2 Luna-related strings"
            strings -a "$ACR" | grep -E               'com\.webos\.service\.acr|luna://com\.webos\.service\.acr|startAcr|getACR|getVideoCaptureStatus|getAudioCaptureStatus|getCapture'               | sort -u | head -1000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Analyze capture-service output paths
        if: always()
        run: |
          REPORT=work/report/capture-service-analysis.txt
          {
            echo "# Capture service static analysis"
            echo
            echo "## Candidate files"
            find work/extract -type f \( -name 'captureservice' -o -name '*capture*service*' -o -name 'libvtcapture.so*' \) -print 2>/dev/null | sort

            CAPTURE="$(find work/extract -type f -name captureservice -print -quit 2>/dev/null || true)"
            if [ -z "$CAPTURE" ]; then
              echo
              echo "captureservice executable not found in extracted output."
              exit 0
            fi

            echo
            echo "## captureservice metadata"
            file "$CAPTURE" || true
            sha256sum "$CAPTURE" || true

            echo
            echo "## dynamic dependencies"
            readelf -d "$CAPTURE" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true

            echo
            echo "## exported/imported capture symbols"
            readelf -Ws "$CAPTURE" 2>/dev/null | grep -Ei \
              'setOutput|executeOneShot|execute|createHandle|destroyHandle|setProperties|setOptions|shared|buffer|memory|socket|stream|file|jpeg|png|bmp|rgb|yuv|vtcapture' \
              | head -2000 || true

            echo
            echo "## setOutput / destination-related strings"
            strings -a -t x "$CAPTURE" | grep -Ei \
              'setOutput|output.*(file|path|buffer|memory|shared|socket|stream)|destination|shared.?memory|memfd|shm|socket|pipe|fd|file|path|URI|jpeg|jpg|png|bmp|rgb|rgba|yuv|raw' \
              | head -3000 || true

            echo
            echo "## method and JSON-key candidates"
            strings -a "$CAPTURE" | grep -Ei \
              'createHandle|destroyHandle|getCapability|getProperties|setProperties|getOptions|setOptions|getOutput|setOutput|executeOneShot|execute|handle|properties|options|output|file|path|format|method|width|height|quality|buffer|memory|shared|socket|stream' \
              | sort -u | head -3000 || true

            echo
            echo "## all short JSON-like keys"
            strings -a "$CAPTURE" | grep -E '^[A-Za-z][A-Za-z0-9_.-]{1,40}$' \
              | sort -u | grep -Ei \
              'capture|output|file|path|format|method|handle|option|property|width|height|quality|buffer|memory|shared|socket|stream|raw|image|video|jpeg|jpg|png|bmp|rgb|yuv' \
              | head -3000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Disassemble capture-service output handlers
        if: always()
        run: |
          REPORT=work/report/capture-service-disassembly.txt
          CAPTURE="$(find work/extract -type f -name captureservice -print -quit 2>/dev/null || true)"
          {
            echo "# Capture service targeted disassembly"
            if [ -z "$CAPTURE" ]; then
              echo "captureservice not found"
              exit 0
            fi

            OBJDUMP="$(command -v arm-linux-gnueabihf-objdump || command -v objdump)"
            echo "objdump=$OBJDUMP"

            for pattern in \
              'processSetOutput' \
              'setClientOutput' \
              'processExecuteEPj' \
              'ImageProcessing6encode'; do
              echo
              echo "===== symbol pattern: $pattern ====="
              line="$(readelf -Ws "$CAPTURE" 2>/dev/null | grep "$pattern" | head -1 || true)"
              echo "$line"
              if [ -z "$line" ]; then
                echo "symbol not found"
                continue
              fi
              value="$(awk '{print $2}' <<<"$line")"
              size="$(awk '{print $3}' <<<"$line")"
              start=$(( (16#$value) & ~1 ))
              stop=$(( start + size ))
              printf 'start=0x%x stop=0x%x size=%s\n' "$start" "$stop" "$size"
              "$OBJDUMP" -d -C \
                --start-address="$start" --stop-address="$stop" \
                "$CAPTURE" 2>/dev/null || true
            done

            echo
            echo "## rodata around output-related literals"
            strings -a -t x "$CAPTURE" | grep -Ei \
              'sharedMemory|shared memory|memory name|memory size|dStream|dFileName|fileName|file path|processSetOutput|setClientOutput|writtenBytes|capturedWidth|capturedHeight' \
              | head -500 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Upload text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx-firmware-acr-analysis
          path: work/report/
          if-no-files-found: warn
          retention-days: 7
