name: Analyze LG CX 04.64.00 firmware

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/analyze-cx-firmware.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Official LG 04.64.00 package for the same 2020 O20 / jhericurl generation.
      # This download is from LG's support CDN. It is not the JP PJA package, so
      # all findings must be treated as same-generation evidence until confirmed
      # on OLED65CXPJA.
      FW_URL: https://gscs-b2c.lge.com/downloadFile?fileId=Y4IONzJGIHWYuTO4uhPVZA

    steps:
      - uses: actions/checkout@v4

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential cmake liblzo2-dev libssl-dev libc6-dev zlib1g-dev             fakeroot squashfs-tools unzip binutils binutils-arm-linux-gnueabihf file

      - name: Download official LG firmware
        run: |
          mkdir -p work/report
          curl --fail --location --retry 3 --retry-delay 5             --output work/firmware.zip "$FW_URL"
          {
            echo "# Firmware download"
            date -u
            ls -lh work/firmware.zip
            sha256sum work/firmware.zip
          } | tee work/report/download.txt

      - name: Inspect and unpack firmware ZIP
        run: |
          {
            echo "# ZIP listing"
            unzip -l work/firmware.zip
          } | tee work/report/zip-listing.txt
          mkdir -p work/zip
          unzip -q work/firmware.zip -d work/zip
          find work/zip -maxdepth 3 -type f -printf '%p\t%s bytes\n'             | tee work/report/unpacked-files.txt
          EPK="$(find work/zip -type f -iname '*.epk' -print -quit)"
          if [ -z "$EPK" ]; then
            echo "No .epk found" | tee work/report/error.txt
            exit 1
          fi
          echo "$EPK" | tee work/epk-path.txt

      - name: Build epk2extract
        run: |
          git clone --depth 1 https://github.com/openlgtv/epk2extract.git work/epk2extract
          cd work/epk2extract
          CMAKE_FLAGS=-DCMAKE_BUILD_TYPE=Test ./build.sh
          find . -type f -name epk2extract -perm -111 -print             | tee ../report/epk2extract-binaries.txt

      - name: Extract EPK and rootfs
        id: extract
        run: |
          set -o pipefail
          EPK="$(cat work/epk-path.txt)"
          # build.sh installs AES.key and the platform PEM files next to this
          # top-level binary. Do not accidentally select build_linux/obj/src/
          # epk2extract, which has no adjacent key files.
          BIN="$(realpath work/epk2extract/build_linux/epk2extract)"
          test -x "$BIN"
          test -f "$(dirname "$BIN")/AES.key"
          test -f "$(dirname "$BIN")/o20.pem"
          mkdir -p work/extract
          cp "$EPK" work/extract/firmware.epk

          (
            cd work/extract
            echo "# EPK extraction"
            fakeroot "$BIN" firmware.epk
          ) 2>&1 | tee work/report/epk-extract.log

          if grep -Eq 'Cannot decrypt EPK|proper AES key is missing|Cannot open key file' work/report/epk-extract.log; then
            echo "EPK decryption failed" >&2
            exit 1
          fi

          ROOTFS="$(find work/extract -type f -name 'rootfs.pak' -print -quit)"
          if [ -n "$ROOTFS" ] && ! find work/extract -type d -name 'rootfs.pak.unsquashfs' -print -quit | grep -q .; then
            ROOTDIR="$(dirname "$ROOTFS")"
            ROOTBASE="$(basename "$ROOTFS")"
            (
              cd "$ROOTDIR"
              echo "# Explicit rootfs extraction"
              fakeroot "$BIN" "$ROOTBASE"
            ) 2>&1 | tee -a "$(realpath work/report/epk-extract.log)"
          fi

          {
            echo "# Extracted top-level files"
            find work/extract -maxdepth 4 -type f -printf '%p\t%s bytes\n' | head -500
          } > work/report/extracted-files.txt

      - name: Analyze ACR capture components
        if: always()
        run: |
          REPORT=work/report/acr-analysis.txt
          {
            echo "# ACR / capture component analysis"
            echo
            echo "## Candidate files"
            find work/extract -type f \(               -name 'acr2' -o               -name 'adoverlay-service' -o               -name 'libvtcapture.so*' -o               -name 'libalphonsosolution.so*' -o               -name 'libalphonsoadoverlay.so*' -o               -name 'libsambasolution.so*' -o               -name 'libnielsensolution.so*'             \) -print 2>/dev/null | sort

            ACR="$(find work/extract -type f -name acr2 -print -quit 2>/dev/null || true)"
            if [ -z "$ACR" ]; then
              echo
              echo "acr2 executable not found in extracted output."
              exit 0
            fi

            echo
            echo "## acr2 file metadata"
            file "$ACR" || true
            sha256sum "$ACR" || true

            echo
            echo "## acr2 dynamic dependencies"
            readelf -d "$ACR" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true

            echo
            echo "## acr2 capture-related strings"
            strings -a "$ACR" | grep -Ei               'libvtcapture|vtcapture|DaiFastCapture|VideoCapture|ImageConverter|CaptureBuff|CaptureDelegate|capture_method|capture_format|video.?capture|getVideoCaptureStatus|getCaptureCondition|getCaptureSpeed|setCaptureSpeed|com\.webos\.service\.capture|capture\.client|CAPTURE_LOCATION|AcquireVt|CreateContext|video60'               | sort -u | head -1000 || true

            echo
            echo "## acr2 Luna-related strings"
            strings -a "$ACR" | grep -E               'com\.webos\.service\.acr|luna://com\.webos\.service\.acr|startAcr|getACR|getVideoCaptureStatus|getAudioCaptureStatus|getCapture'               | sort -u | head -1000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Analyze capture-service output paths
        if: always()
        run: |
          REPORT=work/report/capture-service-analysis.txt
          {
            echo "# Capture service static analysis"
            echo
            echo "## Candidate files"
            find work/extract -type f \( -name 'captureservice' -o -name '*capture*service*' -o -name 'libvtcapture.so*' \) -print 2>/dev/null | sort

            CAPTURE="$(find work/extract -type f -name captureservice -print -quit 2>/dev/null || true)"
            if [ -z "$CAPTURE" ]; then
              echo
              echo "captureservice executable not found in extracted output."
              exit 0
            fi

            echo
            echo "## captureservice metadata"
            file "$CAPTURE" || true
            sha256sum "$CAPTURE" || true

            echo
            echo "## dynamic dependencies"
            readelf -d "$CAPTURE" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true

            echo
            echo "## exported/imported capture symbols"
            readelf -Ws "$CAPTURE" 2>/dev/null | grep -Ei \
              'setOutput|executeOneShot|execute|createHandle|destroyHandle|setProperties|setOptions|shared|buffer|memory|socket|stream|file|jpeg|png|bmp|rgb|yuv|vtcapture' \
              | head -2000 || true

            echo
            echo "## setOutput / destination-related strings"
            strings -a -t x "$CAPTURE" | grep -Ei \
              'setOutput|output.*(file|path|buffer|memory|shared|socket|stream)|destination|shared.?memory|memfd|shm|socket|pipe|fd|file|path|URI|jpeg|jpg|png|bmp|rgb|rgba|yuv|raw' \
              | head -3000 || true

            echo
            echo "## method and JSON-key candidates"
            strings -a "$CAPTURE" | grep -Ei \
              'createHandle|destroyHandle|getCapability|getProperties|setProperties|getOptions|setOptions|getOutput|setOutput|executeOneShot|execute|handle|properties|options|output|file|path|format|method|width|height|quality|buffer|memory|shared|socket|stream' \
              | sort -u | head -3000 || true

            echo
            echo "## all short JSON-like keys"
            strings -a "$CAPTURE" | grep -E '^[A-Za-z][A-Za-z0-9_.-]{1,40}$' \
              | sort -u | grep -Ei \
              'capture|output|file|path|format|method|handle|option|property|width|height|quality|buffer|memory|shared|socket|stream|raw|image|video|jpeg|jpg|png|bmp|rgb|yuv' \
              | head -3000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Disassemble capture-service output handlers
        if: always()
        run: |
          REPORT=work/report/capture-service-disassembly.txt
          CAPTURE="$(find work/extract -type f -name captureservice -print -quit 2>/dev/null || true)"
          {
            echo "# Capture service targeted disassembly"
            if [ -z "$CAPTURE" ]; then
              echo "captureservice not found"
              exit 0
            fi

            OBJDUMP="$(command -v arm-linux-gnueabihf-objdump || command -v objdump)"
            echo "objdump=$OBJDUMP"

            for pattern in \
              'processSetOutput' \
              'setClientOutput' \
              'processExecuteEPj' \
              'ImageProcessing6encode'; do
              echo
              echo "===== symbol pattern: $pattern ====="
              line="$(readelf -Ws "$CAPTURE" 2>/dev/null | grep "$pattern" | head -1 || true)"
              echo "$line"
              if [ -z "$line" ]; then
                echo "symbol not found"
                continue
              fi
              value="$(awk '{print $2}' <<<"$line")"
              size="$(awk '{print $3}' <<<"$line")"
              start=$(( (16#$value) & ~1 ))
              stop=$(( start + size ))
              printf 'start=0x%x stop=0x%x size=%s\n' "$start" "$stop" "$size"
              "$OBJDUMP" -d -C \
                --start-address="$start" --stop-address="$stop" \
                "$CAPTURE" 2>/dev/null || true
            done

            echo
            echo "## rodata around output-related literals"
            strings -a -t x "$CAPTURE" | grep -Ei \
              'sharedMemory|shared memory|memory name|memory size|dStream|dFileName|fileName|file path|processSetOutput|setClientOutput|writtenBytes|capturedWidth|capturedHeight' \
              | head -500 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Analyze PVR SDEC TE transport stack
        if: always()
        run: |
          REPORT=work/report/ts-stack-analysis.txt
          {
            echo "# PVR / SDEC / TE transport-stack analysis"
            echo
            echo "## Candidate libraries and device-facing components"
            find work/extract -type f \( \
              -name 'libkbl-te.so*' -o \
              -name 'libdvr.so*' -o \
              -name 'libelement-demux-aribuhd.so*' -o \
              -iname '*delivery*.so*' -o \
              -iname '*sdec*.so*' -o \
              -iname '*pvr*.so*' -o \
              -iname '*transport*.so*' \
            \) -print 2>/dev/null | sort | head -1000

            TE="$(find work/extract -type f -name 'libkbl-te.so.2.0.1' -print -quit 2>/dev/null || true)"
            DEMUX="$(find work/extract -type f -name 'libelement-demux-aribuhd.so.1.0.0' -print -quit 2>/dev/null || true)"
            DVR="$(find work/extract -type f -name 'libdvr.so.1.0.1' -print -quit 2>/dev/null || true)"

            for f in "$TE" "$DEMUX" "$DVR"; do
              [ -n "$f" ] || continue
              echo
              echo "===== $f ====="
              file "$f" || true
              sha256sum "$f" || true
              echo "-- dynamic dependencies --"
              readelf -d "$f" 2>/dev/null | grep -E 'NEEDED|RPATH|RUNPATH' || true
              echo "-- relevant symbols --"
              readelf -Ws "$f" 2>/dev/null | grep -Ei \
                'openChannel|closeChannel|DELIVERY|PVR|SDEC|TE_|TS_|Demux|FilterDriver|AddWatch|Buffer|mmap|ioctl|read|write|download|upload|record' \
                | head -3000 || true
              echo "-- relevant strings --"
              strings -a -t x "$f" | grep -Ei \
                '/dev/|pvr|sdec|te[0-9]|delivery|open.?channel|close.?channel|TS channel|transport|download|upload|buffer|mmap|ioctl|filter|dump|record|fifo|socket' \
                | head -3000 || true
            done

            if [ -n "$DEMUX" ]; then
              echo
              echo "## Targeted DemuxAribUhd / uFilterDriver disassembly"
              OBJDUMP="$(command -v arm-linux-gnueabihf-objdump || command -v objdump)"
              for pattern in \
                'uFilterDriver.*openChannel' \
                'uFilterDriver.*closeChannel' \
                'DemuxAribUhd.*Open' \
                'DemuxAribUhd.*Start' \
                'DemuxAribUhd.*AddWatch'; do
                echo
                echo "===== symbol pattern: $pattern ====="
                readelf -Ws "$DEMUX" 2>/dev/null | grep -E "$pattern" | head -20 || true
                while read -r line; do
                  [ -n "$line" ] || continue
                  value="$(awk '{print $2}' <<<"$line")"
                  size="$(awk '{print $3}' <<<"$line")"
                  name="$(awk '{print $8}' <<<"$line")"
                  case "$value:$size" in
                    *[!0-9A-Fa-f:]*|'':*|*:0) continue ;;
                  esac
                  start=$(( (16#$value) & ~1 ))
                  stop=$(( start + size ))
                  echo "--- $name start=$(printf '0x%x' "$start") size=$size ---"
                  "$OBJDUMP" -d -C --start-address="$start" --stop-address="$stop" "$DEMUX" 2>/dev/null || true
                done < <(readelf -Ws "$DEMUX" 2>/dev/null | grep -E "$pattern" | head -20 || true)
              done
            fi
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Trace TS consumers device access and IPC
        if: always()
        run: |
          REPORT=work/report/ts-consumer-trace.txt
          python3 - <<'PY' > "$REPORT" 2>&1
          import os
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path("work/extract")
          TARGETS = (
              "libkbl-te.so",
              "libelement-demux-aribuhd.so",
              "libdvr.so",
          )

          def run(args, timeout=20):
              try:
                  return subprocess.run(
                      args,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      text=True,
                      timeout=timeout,
                      check=False,
                  ).stdout
              except Exception:
                  return ""

          def is_elf(path):
              try:
                  with open(path, "rb") as fh:
                      return fh.read(4) == b"\x7fELF"
              except Exception:
                  return False

          def needed(path):
              out = run(["readelf", "-d", str(path)])
              return re.findall(r"Shared library: \[([^\]]+)\]", out)

          def dynsyms(path):
              return run(["readelf", "-Ws", str(path)])

          def strings(path):
              return run(["strings", "-a", "-t", "x", str(path)], timeout=30)

          print("# TS consumer / device-access / IPC static trace")
          print()
          print("Same-generation W20O firmware only; confirm device-specific findings later on JP firmware/runtime.")
          print()

          elfs = [p for p in ROOT.rglob("*") if p.is_file() and is_elf(p)]
          print(f"ELF files scanned: {len(elfs)}")

          consumers = []
          for p in elfs:
              libs = needed(p)
              if any(any(t in lib for t in TARGETS) for lib in libs):
                  consumers.append((p, libs))

          print()
          print("## Reverse dependencies")
          if not consumers:
              print("No direct dynamic consumers found.")
          for p, libs in consumers:
              print()
              print(f"### {p}")
              print("NEEDED:")
              for lib in libs:
                  print(f"  {lib}")

          interesting = []
          for p, _ in consumers:
              interesting.append(p)
          for needle in ("libkbl-te.so.2.0.1", "libelement-demux-aribuhd.so.1.0.0", "libdvr.so.1.0.1"):
              q = next(iter(ROOT.rglob(needle)), None)
              if q is not None:
                  interesting.append(q)

          seen = set()
          interesting = [p for p in interesting if not (str(p) in seen or seen.add(str(p)))]

          access_re = re.compile(
              r"\b(open|open64|openat|ioctl|mmap|mmap2|munmap|read|pread|write|poll|ppoll|select|epoll|eventfd|socket|connect|recv|send|shm_open)\b",
              re.I,
          )
          string_re = re.compile(
              r"(/dev/|/tmp/|/var/run/|/run/|luna://|com\.webos\.|socket|fifo|pipe|shared.?memory|shm|mmap|ioctl|"
              r"pvr|sdec|transport|demux|delivery|TS channel|PES|MMTP|ARIB|filter|buffer|callback)",
              re.I,
          )

          print()
          print("## Device/API imports and IPC strings")
          for p in interesting:
              print()
              print(f"### {p}")
              syms = dynsyms(p)
              imports = []
              for line in syms.splitlines():
                  if " UND " in line and access_re.search(line):
                      imports.append(line.strip())
              print("-- imported device/IPC primitives --")
              if imports:
                  for line in imports[:300]:
                      print(line)
              else:
                  print("(none matched)")

              print("-- relevant strings --")
              matched = [line for line in strings(p).splitlines() if string_re.search(line)]
              for line in matched[:1200]:
                  print(line)

          print()
          print("## PLT call-site context")
          for p in interesting:
              dis = run(["arm-linux-gnueabihf-objdump", "-d", "-C", str(p)], timeout=60)
              lines = dis.splitlines()
              hits = []
              for idx, line in enumerate(lines):
                  if re.search(r"<(?:open|open64|openat|ioctl|mmap|mmap2|read|poll|select|epoll|socket|connect|shm_open)@plt>", line):
                      lo=max(0, idx-5)
                      hi=min(len(lines), idx+7)
                      hits.append("\n".join(lines[lo:hi]))
              if hits:
                  print()
                  print(f"### {p}")
                  for block in hits[:160]:
                      print(block)
                      print("---")

          print()
          print("## Firmware metadata references to consumer basenames")
          names = sorted({p.name for p, _ in consumers})
          metadata_roots = [
              ROOT / "04.64.00.01-HE_DTV_W20O_AFABATAA" / "rootfs.pak.unsquashfs" / "usr" / "share" / "ls2",
              ROOT / "04.64.00.01-HE_DTV_W20O_AFABATAA" / "rootfs.pak.unsquashfs" / "etc",
              ROOT / "04.64.00.01-HE_DTV_W20O_AFABATAA" / "rootfs.pak.unsquashfs" / "usr" / "share",
          ]
          text_ext = {".json", ".conf", ".service", ".sh", ".xml", ".ini", ".role", ".perm"}
          for base in metadata_roots:
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in text_ext:
                      continue
                  try:
                      data=p.read_text(errors="ignore")
                  except Exception:
                      continue
                  if any(name in data for name in names):
                      print()
                      print(f"### {p}")
                      for line in data.splitlines():
                          if any(name in line for name in names):
                              print(line[:2000])
          PY

          cat "$REPORT"

      - name: Build TS static evidence index
        if: always()
        run: |
          REPORT=work/report/ts-evidence-index.txt
          {
            echo "# TS static evidence index"
            echo
            echo "## All transport-related device path literals"
            find work/extract -type f -size -20M -print0 2>/dev/null \
              | xargs -0 -r strings -a 2>/dev/null \
              | grep -E '^/dev/|/dev/(lg/)?(pvr|sdec|te|demod|delivery|ts)' \
              | sort -u | head -3000 || true

            echo
            echo "## LS2 / local IPC names around broadcast, demux, DVR and transport"
            find work/extract -type f -size -20M -print0 2>/dev/null \
              | xargs -0 -r strings -a 2>/dev/null \
              | grep -Ei '^(luna://|com\.webos\.)|broadcast|demux|transport|delivery|dvr|pvr|sdec|timeshift|record' \
              | sort -u | head -5000 || true

            echo
            echo "## ARIB/Japan-oriented demux candidates"
            find work/extract -type f \
              | grep -Ei 'arib|mmt|mmtp|demux|broadcast|delivery|tuner|frontend' \
              | sort | head -3000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Trace HAL DELIVERY implementation
        if: always()
        run: |
          REPORT=work/report/hal-delivery-trace.txt
          python3 - <<'PY' > "$REPORT" 2>&1
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path("work/extract")

          def run(args, timeout=30):
              try:
                  return subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                                        text=True, timeout=timeout, check=False).stdout
              except Exception:
                  return ""

          def is_elf(p):
              try:
                  return p.read_bytes()[:4] == b"\x7fELF"
              except Exception:
                  return False

          elfs=[p for p in ROOT.rglob("*") if p.is_file() and is_elf(p)]
          sym="HAL_DELIVERY_OpenChannel"

          print("# HAL DELIVERY implementation trace")
          print()
          providers=[]
          users=[]
          for p in elfs:
              ws=run(["readelf","-Ws",str(p)],timeout=10)
              matched=[ln for ln in ws.splitlines() if sym in ln]
              if not matched:
                  continue
              if any(" UND " in ln for ln in matched):
                  users.append((p,matched))
              if any(" UND " not in ln for ln in matched):
                  providers.append((p,matched))

          print("## Providers of HAL_DELIVERY_OpenChannel")
          if not providers:
              print("(none found)")
          for p,matched in providers:
              print()
              print(f"### {p}")
              for ln in matched:
                  print(ln.strip())
              print("-- NEEDED --")
              print(run(["readelf","-d",str(p)]))
              print("-- HAL_DELIVERY exports --")
              for ln in run(["readelf","-Ws",str(p)]).splitlines():
                  if "HAL_DELIVERY_" in ln:
                      print(ln.strip())
              print("-- transport/device strings --")
              for ln in run(["strings","-a","-t","x",str(p)],timeout=20).splitlines():
                  if re.search(r"/dev/|arib|mmt|atsc3|delivery|demod|te[0-9]|sdec|pvr|filter|buffer|ioctl|mmap|poll|read",ln,re.I):
                      print(ln)

          print()
          print("## Consumers importing HAL_DELIVERY_OpenChannel")
          for p,matched in users:
              print()
              print(f"### {p}")
              for ln in matched:
                  print(ln.strip())

          print()
          print("## nabs HAL_DELIVERY call sites")
          nabs=next(iter(ROOT.rglob("nabs")),None)
          if nabs and is_elf(nabs):
              print(f"nabs={nabs}")
              dis=run(["arm-linux-gnueabihf-objdump","-d","-C",str(nabs)],timeout=90)
              lines=dis.splitlines()
              methods=[
                  "HAL_DELIVERY_Initialize","HAL_DELIVERY_OpenChannel","HAL_DELIVERY_RequestFilter",
                  "HAL_DELIVERY_GetFilterMessage","HAL_DELIVERY_CopyFilterData",
                  "HAL_DELIVERY_ReturnFilterData","HAL_DELIVERY_GetBBFrameBuffer",
                  "HAL_DELIVERY_ReturnBBFrameBuffer","HAL_DELIVERY_CloseChannel"
              ]
              for meth in methods:
                  print()
                  print(f"### {meth}")
                  hit=0
                  for i,line in enumerate(lines):
                      if f"<{meth}@plt>" in line and "bl" in line:
                          hit += 1
                          print("\n".join(lines[max(0,i-8):min(len(lines),i+10)]))
                          print("---")
                          if hit >= 40:
                              break
                  if hit == 0:
                      print("(no direct call sites found)")

          print()
          print("## ARIB/MMT/player configuration")
          names=("conf-arib.json","nabsplayer-mmt.conf","nabsplayer-route.conf")
          for name in names:
              for p in ROOT.rglob(name):
                  print()
                  print(f"### {p}")
                  try:
                      print(p.read_text(errors="ignore")[:30000])
                  except Exception:
                      pass
          PY

          cat "$REPORT"

      - name: Disassemble KADP transport functions
        if: always()
        run: |
          REPORT=work/report/kadp-transport-disassembly.txt
          {
            echo "# KADP transport targeted disassembly"
            KADP="$(find work/extract -type f -name 'libkadaptor.so.2.0.1' -print -quit 2>/dev/null || true)"
            HAL="$(find work/extract -type f -name 'libhal_lg115x.so.2' -o -name 'libhal_lg115x.so.2.0.1' | head -1)"
            OBJDUMP="$(command -v arm-linux-gnueabihf-objdump || command -v objdump)"

            echo "KADP=$KADP"
            echo "HAL=$HAL"
            echo "OBJDUMP=$OBJDUMP"

            if [ -n "$KADP" ]; then
              echo
              echo "## KADP symbols and disassembly"
              for sym in                 KADP_SDEC_Open                 KADP_SDEC_OpenChannel                 KADP_SDEC_StartInputTsDump                 KADP_SDEC_GetTsDumpWptr                 KADP_SDEC_StopInputTsDump                 KADP_SDEC_GetStreamFilterBufferInfo                 KADP_SDEC_SetStreamFilterReadPtr                 KADP_PVR_Open                 KADP_PVR_DnOpen                 KADP_PVR_DnGetBufferInfo                 KADP_PVR_DnSetReadPtr                 KADP_PVR_Mmap                 KADP_ARIB2_Open                 KADP_ARIB2_OpenChannel                 KADP_ARIB2_Read; do
                echo
                echo "===== $sym ====="
                line="$(readelf -Ws "$KADP" 2>/dev/null | awk -v s="$sym" '$8==s {print; exit}')"
                echo "$line"
                [ -n "$line" ] || continue
                value="$(awk '{print $2}' <<<"$line")"
                size="$(awk '{print $3}' <<<"$line")"
                case "$value:$size" in
                  *[!0-9A-Fa-f:]*|'':*|*:0) continue ;;
                esac
                start=$(( (16#$value) & ~1 ))
                stop=$(( start + size ))
                printf 'start=0x%x stop=0x%x size=%s\n' "$start" "$stop" "$size"
                "$OBJDUMP" -d -C --start-address="$start" --stop-address="$stop" "$KADP" 2>/dev/null || true
              done

              echo
              echo "## KADP transport strings"
              strings -a -t x "$KADP" | grep -Ei                 '/dev/lg/(sdec|pvr|te|arib2|demod)|StartInputTsDump|GetTsDumpWptr|StopInputTsDump|DnGetBufferInfo|DnSetReadPtr|DMX_SET_|DMX_GET_|stream filter|ts dump|mmap|read ptr|write ptr'                 | head -4000 || true
            fi

            if [ -n "$HAL" ]; then
              echo
              echo "## HAL delivery read/data functions"
              for sym in                 HAL_DELIVERY_RequestData                 HAL_DELIVERY_Read                 HAL_DELIVERY_OpenChannel                 HAL_DELIVERY_GetFilterMessage                 HAL_DELIVERY_CopyFilterData; do
                echo
                echo "===== $sym ====="
                line="$(readelf -Ws "$HAL" 2>/dev/null | awk -v s="$sym" '$8==s {print; exit}')"
                echo "$line"
                [ -n "$line" ] || continue
                value="$(awk '{print $2}' <<<"$line")"
                size="$(awk '{print $3}' <<<"$line")"
                case "$value:$size" in
                  *[!0-9A-Fa-f:]*|'':*|*:0) continue ;;
                esac
                start=$(( (16#$value) & ~1 ))
                stop=$(( start + size ))
                "$OBJDUMP" -d -C --start-address="$start" --stop-address="$stop" "$HAL" 2>/dev/null || true
              done
            fi
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Trace SDEC TS dump callers
        if: always()
        run: |
          REPORT=work/report/sdec-tsdump-callers.txt
          {
            echo "# SDEC TS dump caller trace"
            OBJDUMP="$(command -v arm-linux-gnueabihf-objdump || command -v objdump)"
            for F in               "$(find work/extract -type f -name 'libhal_lg115x.so.2.0.1' -print -quit 2>/dev/null || true)"               "$(find work/extract -type f -name 'libhal_lg115x.so.2' -print -quit 2>/dev/null || true)"               "$(find work/extract -type f -name 'nabs' -print -quit 2>/dev/null || true)"               "$(find work/extract -type f -name 'libgibbsplayer.so.1.0.0' -print -quit 2>/dev/null || true)"; do
              [ -n "$F" ] || continue
              echo
              echo "===== $F ====="
              "$OBJDUMP" -d -C "$F" > /tmp/full.dis 2>/dev/null || true
              for sym in                 KADP_SDEC_StartInputTsDump                 KADP_SDEC_GetTsDumpWptr                 KADP_SDEC_StopInputTsDump; do
                echo
                echo "### callers of $sym"
                grep -n "<$sym@plt>" /tmp/full.dis | while IFS=: read -r n rest; do
                  start=$((n-24)); [ $start -lt 1 ] && start=1
                  end=$((n+16))
                  sed -n "${start},${end}p" /tmp/full.dis
                  echo "---"
                done
              done
            done

            echo
            echo "## Candidate TS dump strings"
            find work/extract -type f \( -name 'libhal_lg115x.so*' -o -name 'nabs' -o -name 'libgibbsplayer.so*' \) -print0 2>/dev/null \
              | xargs -0 -r strings -a -t x 2>/dev/null \
              | grep -Ei 'StartInputTsDump|GetTsDumpWptr|StopInputTsDump|ts.?dump|dump.?ts|input.?dump|packet.?size|188|192' \
              | head -4000 || true
          } > "$REPORT" 2>&1

          cat "$REPORT"

      - name: Upload text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx-firmware-acr-analysis
          path: work/report/
          if-no-files-found: warn
          retention-days: 7
